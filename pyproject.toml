[project]
name = "site-cabsec"
version = "0.1.0"
description = "Website for the orgpedia/cabsec dataset"
authors = [{ name = "mukundesh", email = "mukundesh@outlook.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "docint",
    "orgpedia",
    "orgpedia-cabsec>=0.0.10",
    "setuptools<81",  # orgpedia/docint still import pkg_resources
    "black>=24.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
docint = { git = "https://github.com/mukundesh/docInt.git" }
orgpedia = { git = "https://github.com/orgpedia/orgpedia.git" }

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.yml
  | \.json
  | \.txt
  | \.bak
  | makefile
  | _build
  | buck-out
  | build
  | dist
  | input
  | output
  | logs
  | conf
  | models
  | export
  | documents
)/
'''

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    ".tox",
    "__pypackages__",
    "dist",
    "node_modules",
    "venv",
    ".bak",
    "input",
    "output",
    "logs",
    "conf",
    "export",
    "models",
    "documents",
    "data_packages",
    "websites",
    "page_images",
    "html",
]

# Same as Black.
line-length = 100

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F", "W", "I001"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["I001"] # fix only isort issues
unfixable = []
per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
#dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
